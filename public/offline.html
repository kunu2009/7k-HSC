<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline • 7k HSC</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #6366f1;
      --radius: 16px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body {
      margin: 0;
      background: linear-gradient(145deg, #0b1224, #111827);
      color: var(--text);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      padding: 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .muted { color: var(--muted); margin: 0 0 16px; line-height: 1.5; }
    .badges { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button, a {
      all: unset;
      cursor: pointer;
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 700;
      text-align: center;
    }
    .primary {
      background: linear-gradient(120deg, #6366f1, #8b5cf6);
      color: #fff;
      flex: 1;
    }
    .ghost {
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
      flex: 1;
    }
    .tips { margin-top: 16px; font-size: 13px; color: var(--muted); line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badges">
      <span class="badge">Offline</span>
      <span class="badge">7k HSC</span>
    </div>
    <h1 class="title">You are offline</h1>
    <p class="muted">Don’t worry, your recent content is available. Reconnect to fetch the latest notes, tests, and updates.</p>
    <div class="actions">
      <button class="primary" onclick="location.reload()">Retry Connection</button>
      <a class="ghost" href="/">Back to App</a>
    </div>
    <p class="tips">Tip: Add this app to your home screen for a faster, offline-friendly experience.</p>
  </div>
</body>
</html>
